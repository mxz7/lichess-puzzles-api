name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: check formatting
        run: cargo fmt --check

      - name: lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: run Rust tests
        run: cargo test --locked

      - name: install SQLx CLI
        run: cargo install sqlx-cli --version 0.9.0 --debug --locked --no-default-features --features sqlite,sqlx-toml

      - name: check SQLx query metadata
        run: |
          sqlx_tmp="$(mktemp -d "$RUNNER_TEMP/sqlx-check.XXXXXX")"
          DATABASE_URL="file:$sqlx_tmp/schema.db" cargo run --locked -- migrate
          SQLX_DATABASE_URL="sqlite://$sqlx_tmp/schema.db" cargo sqlx prepare --check -- --all-targets --locked

      - name: install Atlas
        uses: ariga/setup-atlas@v0
        with:
          version: v1.4.0

      - name: validate SQLite migrations
        run: atlas migrate validate --env local

      - name: check Atlas schema matches migrations
        run: |
          diff="$(atlas schema diff --env local --from env://migration.dir --to env://schema.src --format '{{ sql . }}')"
          if [ -n "$diff" ]; then
            echo "The Atlas schema and migrations differ."
            printf '%s\n' "$diff"
            exit 1
          fi

  build:
    needs: checks
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v4

      - name: login to container registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_PREFIX }}:${{ github.sha }},${{ env.IMAGE_PREFIX }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: deploy
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.AUTH_TOKEN }}
          application_id: ${{ secrets.APPLICATION_ID }}
          dokploy_url: ${{ secrets.URL }}
          service_type: application
